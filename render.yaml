# Blueprint de Render: crea la base PostgreSQL y la API automáticamente.
services:
  - type: web
    name: vetcare24-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vetcare24-db
          property: connectionString
      - key: SEED_ON_START
        value: "true"
databases:
  - name: vetcare24-db
    plan: free
