name: CI VetCare 24

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Revisar estilo (Ruff)
        run: python -m ruff check src tests scripts
      - name: Pruebas con cobertura mínima de 80 %
        run: python -m pytest -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  docker:
    needs: calidad-y-pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen y probar con Docker Compose
        run: |
          docker compose build
          docker compose --profile tests run --rm tests
